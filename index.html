<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Mi Gestor Cinéfilo Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-dark sticky-top mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1 fs-4 brand-title">
                <i class="bi bi-film me-2"></i>GESTOR CINÉFILO
            </span>
            <div class="d-flex align-items-center gap-2">
                <!-- Botón Comunidad (seguimiento entre usuarios) -->
                <button class="btn btn-outline-info btn-sm px-3 rounded-3" onclick="window.abrirModalComunidad()">
                    <i class="bi bi-people-fill me-1"></i> Comunidad
                </button>

                <!-- Botón Buzón de Recomendaciones -->
                <button class="btn btn-outline-warning btn-sm px-3 rounded-3 position-relative" onclick="abrirModalBuzon()">
                    <i class="bi bi-bell-fill me-1"></i> Recomendaciones
                    <span id="badgeNotificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                </button>

                <span class="text-muted small mx-2">
                    <i class="bi bi-person-circle text-danger me-1"></i> <span id="nombreUsuarioActivo" class="fw-bold text-white">Cargando...</span>
                    <span id="contadoresSeguimiento" class="text-muted ms-1"></span>
                </span>
                
                <button class="btn btn-outline-light btn-sm px-3 rounded-3" onclick="abrirModalEstadisticas()">
                    <i class="bi bi-bar-chart-line-fill text-info me-1"></i> Estadísticas
                </button>
                <button class="btn btn-outline-danger btn-sm px-3 rounded-3 ms-2" id="btnCerrarSesion">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
        <div class="row g-4">
            <!-- Columna Formulario -->
            <div class="col-12 col-xl-4">
                <div class="card card-cine">
                    <div class="card-header card-header-cine text-white d-flex align-items-center">
                        <i class="bi bi-plus-circle-fill text-danger me-2 fs-5"></i>
                        <span>Detalles de la Película</span>
                    </div>
                    <div class="card-body p-4">
                        <form id="formularioPelicula">
                            <input type="hidden" id="peliculaId">

                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-muted fw-bold">Título *</label>
                                <input type="text" id="titulo" class="form-control" required placeholder="Ej: Interstellar">
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-muted fw-bold">Año</label>
                                    <input type="number" id="anio" class="form-control" placeholder="YYYY">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-muted fw-bold">Director</label>
                                    <input type="text" id="director" class="form-control" placeholder="Ej: Christopher Nolan">
                                </div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-muted fw-bold">Género Principal</label>
                                    <input type="text" id="generoPrincipal" class="form-control" placeholder="Sci-Fi">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-muted fw-bold">Categoría</label>
                                    <select id="categoria" class="form-select">
                                        <option value="Cine de Culto">Cine de Culto</option>
                                        <option value="Taquillera">Taquillera</option>
                                        <option value="Documental">Documental</option>
                                        <option value="Independiente">Independiente</option>
                                        <option value="Animación">Animación</option>
                                        <option value="Otra">Otra</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-muted fw-bold">Fecha Vista</label>
                                    <input type="date" id="fechaVista" class="form-control">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-muted fw-bold">Calificación: <span id="valCalificacion" class="badge-calificacion ms-1">5</span></label>
                                    <input type="range" id="calificacion" class="form-range mt-2" min="1" max="10" value="5" oninput="document.getElementById('valCalificacion').innerText = this.value">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-muted fw-bold">Reseña / Notas</label>
                                <textarea id="reseniaNotas" class="form-control" rows="3" placeholder="Escribe tu opinión..."></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-red w-100 py-2"><i class="bi bi-cloud-upload-fill me-1"></i> Guardar en la Nube</button>
                                <button type="button" class="btn btn-outline-secondary py-2" onclick="limpiarFormulario()"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Tabla y Buscador -->
            <div class="col-12 col-xl-8">
                <div class="card card-cine mb-4">
                    <div class="card-body p-3">
                        <div class="input-group input-group-lg border-0">
                            <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-search fs-5"></i></span>
                            <input type="text" id="buscador" class="form-control bg-transparent border-0 fs-6" placeholder="Buscar por título, director o género..." oninput="window.filtrarTabla()">
                        </div>
                    </div>
                </div>

                <div class="card card-cine">
                    <div class="card-header card-header-cine d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-collection-play-fill text-danger me-2"></i> Catálogo en la Nube</span>
                        <span id="contadorPeliculas" class="badge bg-dark border border-secondary">0 películas</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-cine align-middle">
                            <thead>
                                <tr>
                                    <th>Película</th>
                                    <th>Director</th>
                                    <th>Género</th>
                                    <th>Categoría</th>
                                    <th>Nota</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoTabla">
                                <tr><td colspan="6" class="text-center py-5 text-muted"><div class="spinner-border text-danger" role="status"></div><div class="mt-2">Sincronizando con la nube...</div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Comunidad (Seguimiento entre usuarios) -->
    <div class="modal fade" id="modalComunidad" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-cine">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold"><i class="bi bi-people-fill text-info me-2"></i> Comunidad Cinéfila</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <ul class="nav nav-tabs nav-justified border-bottom border-secondary mb-3" id="comunidadTabs">
                        <li class="nav-item">
                            <button class="nav-link active text-white fw-bold" data-bs-toggle="tab" data-bs-target="#panelDescubrir" type="button" onclick="window.cargarListaComunidad('todos')">Descubrir</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-white fw-bold" data-bs-toggle="tab" data-bs-target="#panelSiguiendo" type="button" onclick="window.cargarListaComunidad('siguiendo')">Siguiendo</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-white fw-bold" data-bs-toggle="tab" data-bs-target="#panelSeguidores" type="button" onclick="window.cargarListaComunidad('seguidores')">Seguidores</button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="panelDescubrir"></div>
                        <div class="tab-pane fade" id="panelSiguiendo"></div>
                        <div class="tab-pane fade" id="panelSeguidores"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Recomendar Película a un Usuario -->
    <div class="modal fade" id="modalRecomendar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-cine">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold"><i class="bi bi-send-fill text-danger me-2"></i> Recomendar Película</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="small text-muted mb-3">Vas a recomendar: <strong id="recTituloPelicula" class="text-white"></strong></p>
                    <div class="mb-3">
                        <label class="form-label small text-uppercase text-muted fw-bold">Seleccionar Amigo / Usuario</label>
                        <select id="selectUsuarioDestino" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-uppercase text-muted fw-bold">Nota / Mensaje personal</label>
                        <textarea id="msgRecomendacion" class="form-control" rows="2" placeholder="¡Tienes que verla, te va a encantar!"></textarea>
                    </div>
                    <button class="btn btn-red w-100 py-2" onclick="window.enviarRecomendacion()"><i class="bi bi-send me-1"></i> Enviar Sugerencia</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Buzón de Recomendaciones Recibidas -->
    <div class="modal fade" id="modalBuzon" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-cine">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold"><i class="bi bi-bell-fill text-warning me-2"></i> Recomendaciones Recibidas</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="listaRecomendaciones">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Estadísticas -->
    <div class="modal fade" id="modalEstadisticas" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-cine">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pie-chart-fill text-info me-2"></i> Dashboard Cinéfilo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="contenidoEstadisticas"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
