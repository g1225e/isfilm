<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Iniciar Sesión - Gestor Cinéfilo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 450px;">
        <div class="text-center mb-4">
            <h1 class="brand-title display-5 fw-bold"><i class="bi bi-film me-2"></i>GESTOR CINÉFILO</h1>
            <p class="text-muted">Conéctate a tu base de datos en la nube</p>
        </div>

        <div class="card card-cine">
            <div class="card-header card-header-cine p-0 border-0">
                <ul class="nav nav-tabs nav-justified border-bottom border-secondary" id="authTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active text-white fw-bold py-3" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">Ingresar</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link text-white fw-bold py-3" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">Registrarse</button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4">
                <div class="tab-content">
                    <!-- Login -->
                    <div class="tab-pane fade show active" id="login-panel">
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-muted fw-bold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="loginEmail" class="form-control" required placeholder="correo@ejemplo.com">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-muted fw-bold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-red w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión</button>
                        </form>
                    </div>

                    <!-- Registro -->
                    <div class="tab-pane fade" id="register-panel">
                        <form id="formRegister">
                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-muted fw-bold">Nombre de Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" id="regNombre" class="form-control" required placeholder="Tu apodo visible">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-muted fw-bold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope-plus"></i></span>
                                    <input type="email" id="regEmail" class="form-control" required placeholder="correo@ejemplo.com">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-muted fw-bold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" id="regPassword" class="form-control" required placeholder="Mínimo 6 caracteres">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-outline-light w-100 py-2"><i class="bi bi-check-circle me-1"></i> Crear Cuenta en la Nube</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Firebase (Módulos JS) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración con tus credenciales
        const firebaseConfig = {
            apiKey: "AIzaSyAifRBdl7eQZ78kkX0NZW7bH7Ph__pfcDI",
            authDomain: "gestor-cinefilo-web.firebaseapp.com",
            projectId: "gestor-cinefilo-web",
            storageBucket: "gestor-cinefilo-web.firebasestorage.app",
            messagingSenderId: "1004373304427",
            appId: "1:1004373304427:web:e5b438395f54817613bd2e",
            measurementId: "G-X9RRQ8GCJM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Si ya está logueado, enviar al panel
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        // Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'index.html';
            } catch (error) {
                alert('Error al iniciar sesión: ' + error.message);
            }
        });

        // Registro
        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (pass.length < 6) return alert('La contraseña debe tener al menos 6 caracteres.');

            try {
                const creds = await createUserWithEmailAndPassword(auth, email, pass);
                // Guardar perfil público en Firestore para poder recomendarse entre sí
                await setDoc(doc(db, "usuarios", creds.user.uid), {
                    nombre: nombre,
                    email: email,
                    uid: creds.user.uid
                });
                window.location.href = 'index.html';
            } catch (error) {
                alert('Error al registrar usuario: ' + error.message);
            }
        });
    </script>
</body>
</html>
