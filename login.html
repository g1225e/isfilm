<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Iniciar Sesión - Gestor Cinéfilo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 450px;">
        <div class="text-center mb-4">
            <h1 class="brand-title display-5 fw-bold"><i class="bi bi-film me-2"></i>GESTOR CINÉFILO</h1>
            <p class="text-muted">Ingresa a tu catálogo personal de películas</p>
        </div>

        <div class="card card-cine">
            <div class="card-header card-header-cine p-0 border-0">
                <ul class="nav nav-tabs nav-justified border-bottom border-secondary" id="authTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active text-white fw-bold py-3" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">Ingresar</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link text-white fw-bold py-3" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">Registrarse</button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4">
                <div class="tab-content">
                    <!-- Formulario Login -->
                    <div class="tab-pane fade show active" id="login-panel">
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-muted fw-bold">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" id="loginUsuario" class="form-control" required placeholder="Tu usuario">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-muted fw-bold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-red w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión</button>
                        </form>
                    </div>

                    <!-- Formulario Registro -->
                    <div class="tab-pane fade" id="register-panel">
                        <form id="formRegister">
                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-muted fw-bold">Nuevo Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person-plus"></i></span>
                                    <input type="text" id="regUsuario" class="form-control" required placeholder="Crea un usuario">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-muted fw-bold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" id="regPassword" class="form-control" required placeholder="Mínimo 4 caracteres">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-outline-light w-100 py-2"><i class="bi bi-check-circle me-1"></i> Crear Cuenta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lógica de Autenticación Local
        const USERS_KEY = 'cinefilo_usuarios_db';
        const SESSION_KEY = 'cinefilo_usuario_activo';

        // Redirigir si ya está logueado
        if (localStorage.getItem(SESSION_KEY)) {
            window.location.href = 'index.html';
        }

        function obtenerUsuarios() {
            const data = localStorage.getItem(USERS_KEY);
            return data ? JSON.parse(data) : [];
        }

        // Registro
        document.getElementById('formRegister').addEventListener('submit', (e) => {
            e.preventDefault();
            const usuario = document.getElementById('regUsuario').value.trim().toLowerCase();
            const pass = document.getElementById('regPassword').value;

            if (pass.length < 4) return alert('La contraseña debe tener al menos 4 caracteres.');

            const usuarios = obtenerUsuarios();
            if (usuarios.find(u => u.usuario === usuario)) {
                return alert('El nombre de usuario ya existe. Elige otro.');
            }

            usuarios.push({ usuario, pass });
            localStorage.setItem(USERS_KEY, JSON.stringify(usuarios));
            localStorage.setItem(SESSION_KEY, usuario);
            window.location.href = 'index.html';
        });

        // Login
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value;

            const usuarios = obtenerUsuarios();
            const userMatch = usuarios.find(u => u.usuario === usuario && u.pass === pass);

            if (userMatch) {
                localStorage.setItem(SESSION_KEY, usuario);
                window.location.href = 'index.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        });
    </script>
</body>
</html>
